name: Bug report
description: Report a problem with mcprism
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report!

        **Before posting:** redact API keys, tokens, passwords, auth headers, private server URLs, usernames and sensitive paths. Do not attach raw configs or reports; they may contain command arguments and local paths. Share a minimal sanitized example with placeholders. Report security vulnerabilities privately using `SECURITY.md`.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include a sanitized command, expected behavior and actual behavior. Remove tokens or other sensitive arguments.
      placeholder: |
        Command: mcprism scan ...
        Expected: ...
        Actual: ...
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: mcprism version
      description: Output of `mcprism version`
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS & architecture
      placeholder: e.g. Ubuntu 24.04 arm64, macOS 15 amd64, Windows 11
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Sanitized MCP config (optional)
      description: Replace credentials, private hostnames and sensitive local paths with placeholders before submitting.
      render: json
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and could not find a duplicate
          required: true
        - label: This is not a security vulnerability (those are reported privately via SECURITY.md)
          required: true
