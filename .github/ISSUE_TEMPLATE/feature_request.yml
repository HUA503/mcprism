name: Feature request
description: Suggest an idea or a new rule for mcprism
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Thanks for suggesting an improvement!
  - type: dropdown
    id: kind
    attributes:
      label: Type of request
      options:
        - New detection rule
        - Output / reporting improvement
        - Client / transport support
        - CI / integration
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What are you trying to do, and what is missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: If proposing a rule, include example evidence and why false positives will be low.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and could not find a duplicate
          required: true
