name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.25"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Package and upload VS Code extension
        working-directory: editors/vscode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          extension_version="${GITHUB_REF_NAME#v}"
          npm version "$extension_version" --no-git-tag-version --allow-same-version
          vsix="mcprism-vscode-${extension_version}.vsix"
          npx --yes @vscode/vsce@4.0.2 package --out "$vsix"
          sha256sum "$vsix" >> ../../dist/checksums.txt
          gh release upload "$GITHUB_REF_NAME" "$vsix" ../../dist/checksums.txt --clobber
      - name: Attest release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: Update Homebrew formula
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Skipping Homebrew formula update for prerelease ${RELEASE_TAG}"
            exit 0
          fi
          git fetch origin main
          git checkout -B main origin/main
          bash ./scripts/update-homebrew-formula.sh "$RELEASE_TAG"
          if git diff --quiet -- Formula/mcprism.rb; then
            echo "Homebrew formula is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/mcprism.rb
          git commit -m "Homebrew formula update for mcprism ${RELEASE_TAG}"
          git push origin main

  vscode-marketplace:
    if: vars.VSCODE_MARKETPLACE_PUBLISH == 'true'
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Package and publish VS Code extension
        working-directory: editors/vscode
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          extension_version="${RELEASE_TAG#v}"
          npm version "$extension_version" --no-git-tag-version --allow-same-version
          vsix="$RUNNER_TEMP/mcprism-vscode-${extension_version}.vsix"
          npx --yes @vscode/vsce@4.0.2 package --out "$vsix"
          npx --yes @vscode/vsce@4.0.2 publish --packagePath "$vsix" --oidc
