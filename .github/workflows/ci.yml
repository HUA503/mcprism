name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          check-latest: true
      - name: Verify modules
        run: go mod verify
      - name: gofmt
        run: |
          out=$(gofmt -l internal cmd)
          if [ -n "$out" ]; then
            echo "These files need gofmt -w:"
            echo "$out"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test (with race detector)
        run: go test -race -count=1 ./...
      - name: Build
        run: go build ./...
      - name: Smoke test (static scan)
        run: |
          go build -o mcprism ./cmd/mcprism
          # A clean config must pass with exit 0.
          ./mcprism scan examples/clean.mcp.json
          # A gate failure still produces a usable report.
          status=0
          ./mcprism scan examples/vulnerable.mcp.json -f json -o audit.json || status=$?
          if [ "$status" -ne 1 ] || [ ! -s audit.json ]; then
            echo "expected exit 1 and an audit report for the vulnerable sample"
            exit 1
          fi
          status=0
          ./mcprism scan examples/clean.mcp.json --fail-on typo || status=$?
          if [ "$status" -ne 2 ]; then
            echo "expected exit 2 for an invalid severity"
            exit 1
          fi

  cross-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          check-latest: true
      # Files carrying an implicit _windows GOOS suffix are only compiled on
      # Windows, so a Linux-only run misses them. Cross vet compiles the
      # Windows test packages and catches build breaks before release.
      - name: Vet (Windows)
        run: GOOS=windows go vet ./...
      - name: Build (Windows)
        run: GOOS=windows go build ./...
      - name: Vet (Windows ARM64)
        run: GOOS=windows GOARCH=arm64 go vet ./...
      - name: Build (Windows ARM64)
        run: GOOS=windows GOARCH=arm64 go build ./...

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          check-latest: true
      - name: Test (native Windows)
        run: go test -count=1 ./...
