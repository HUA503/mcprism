# Codex MCP config example. These values mirror examples/clean.mcp.json.

[mcp_servers.notes]
command = "npx"
args = ["-y", "@acme/notes-mcp@2.0.1"]

[mcp_servers.notes.env]
API_TOKEN = "${NOTES_TOKEN}"

[mcp_servers.secure-remote]
url = "https://mcp.example.com/v1"
bearer_token_env_var = "MCP_TOKEN"
